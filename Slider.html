<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider</title>
  <style>
    /* -----------------------------------------------------------
       ULTRA-LIGHTWEIGHT, HIGH-PERFORMANCE CAROUSEL SLIDER
       - 0 external libraries (0 KB external JS/CSS)
       - 100% Hardware-accelerated GPU translate3d transforms
       - Native touch/drag swipe + seamless infinite looping
       - Extremely server-friendly: ~1-2 KB gzipped, zero CPU overhead
       ----------------------------------------------------------- */
    :root {
      --slide-width: 100px;
      --slide-height: 150px;
      --slide-gap: 24px;
      --slider-bg: #171717;
      --card-radius: 4px;
      --transition-speed: 450ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--slider-bg);
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .slider-wrapper {
      position: relative;
      width: 100%;
      height: var(--slide-height);
      background-color: var(--slider-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      outline: none;
    }

    .slider-track {
      display: flex;
      gap: var(--slide-gap);
      height: var(--slide-height);
      align-items: center;
      cursor: grab;
      will-change: transform;
      touch-action: pan-y;
    }

    .slider-track.grabbing {
      cursor: grabbing;
    }

    .slide-item {
      flex: 0 0 var(--slide-width);
      width: var(--slide-width);
      height: var(--slide-height);
      border-radius: var(--card-radius);
      overflow: hidden;
      background-color: #222;
      display: block;
      text-decoration: none;
      position: relative;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.22s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.22s ease;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .slide-item:hover,
    .slide-item:focus-visible {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
      outline: none;
      z-index: 2;
    }

    .slide-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      user-drag: none;
      background-color: #2a2a2a;
    }

    /* Navigation Arrows */
    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, background-color 0.2s ease, transform 0.2s ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .slider-wrapper:hover .slider-arrow {
      opacity: 0.85;
      pointer-events: auto;
    }

    .slider-arrow:hover {
      opacity: 1 !important;
      background-color: rgba(0, 0, 0, 0.9);
      transform: translateY(-50%) scale(1.1);
    }

    .slider-arrow:active {
      transform: translateY(-50%) scale(0.95);
    }

    .slider-arrow.prev {
      left: 12px;
    }

    .slider-arrow.next {
      right: 12px;
    }

    .slider-arrow svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (hover: none) {
      .slider-arrow {
        opacity: 0.6;
        pointer-events: auto;
      }
    }

    /* Edge gradients for smooth aesthetic */
    .slider-edge-fade {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35px;
      pointer-events: none;
      z-index: 5;
    }
    .slider-edge-left {
      left: 0;
      background: linear-gradient(to right, var(--slider-bg), transparent);
    }
    .slider-edge-right {
      right: 0;
      background: linear-gradient(to left, var(--slider-bg), transparent);
    }
  </style>
</head>
<body>

  <div class="slider-wrapper" id="sliderWrapper" tabindex="0" role="region" aria-label="Movie and Series Categories Slider">
    <div class="slider-edge-fade slider-edge-left" aria-hidden="true"></div>
    <div class="slider-edge-fade slider-edge-right" aria-hidden="true"></div>

    <button type="button" class="slider-arrow prev" id="sliderPrev" aria-label="Previous slide">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="slider-track" id="sliderTrack">
      <a class="slide-item" href="/category/horror/" target="_blank" rel="noopener" aria-label="Horror Movies">
        <img src="https://catimages.org/images/2021/01/16/Horror-M-1.jpg" alt="Horror Movies" loading="eager" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="/category/netflix/series/" target="_blank" rel="noopener" aria-label="Netflix Series">
        <img src="https://catimages.org/images/2026/09/26/netf.jpg" alt="Netflix Series" loading="eager" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="https://katworld.net/?type=MoviesBaba" target="_blank" rel="noopener" aria-label="MoviesBaba">
        <img src="https://catimages.org/images/2026/08/20/hindd.jpg" alt="MoviesBaba" loading="eager" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="/category/telugu-dubbed-vo/" target="_blank" rel="noopener" aria-label="Hollywood Movie Telugu Dubbed">
        <img src="https://catimages.org/images/2021/06/01/Hollywood-Movie-Telugu-Dubbed-Poster.jpg" alt="Hollywood Movie Telugu Dubbed" loading="eager" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="https://katworld.net/?type=PikaHD" target="_blank" rel="noopener" aria-label="PikaHD">
        <img src="https://catimages.org/images/2026/08/20/N0DpEz43RK.jpg" alt="PikaHD" loading="eager" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="https://katworld.net/?type=KatDrama" target="_blank" rel="noopener" aria-label="KatDrama">
        <img src="https://catimages.org/images/2026/09/26/kdramma.jpg" alt="KatDrama" loading="lazy" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="/category/tamil-dubbed/" target="_blank" rel="noopener" aria-label="Tamil Dubbed">
        <img src="https://catimages.org/images/2021/06/01/Tamil-Dubbed.jpg" alt="Tamil Dubbed" loading="lazy" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="https://katworld.net/?type=Katmovie18" target="_blank" rel="noopener" aria-label="Adult 18+ Movies">
        <img src="https://catimages.org/images/2021/01/16/18-3.jpg" alt="Adult-Erotic-movies" loading="lazy" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="https://katworld.net/?type=KatDrama" target="_blank" rel="noopener" aria-label="KatDrama Series">
        <img src="https://catimages.org/images/2026/09/26/trdun.jpg" alt="Drama Series" loading="lazy" decoding="async" referrerpolicy="no-referrer">
      </a>
      <a class="slide-item" href="https://katworld.net/?type=KatDrama" target="_blank" rel="noopener" aria-label="Chinese Drama in Hindi">
        <img src="https://catimages.org/images/2020/12/30/Chinese-Drama-in-Hindi.jpg" alt="Chinese Drama in Hindi" loading="lazy" decoding="async" referrerpolicy="no-referrer">
      </a>
    </div>

    <button type="button" class="slider-arrow next" id="sliderNext" aria-label="Next slide">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script>
    (function () {
      'use strict';

      const wrapper = document.getElementById('sliderWrapper');
      const track = document.getElementById('sliderTrack');
      const prevBtn = document.getElementById('sliderPrev');
      const nextBtn = document.getElementById('sliderNext');
      if (!wrapper || !track) return;

      const slides = Array.from(track.children);
      const count = slides.length;
      if (count === 0) return;

      // Create 6 sets total (2 sets cloned before, 1 original set, 3 sets cloned after)
      // This ensures 100% seamless infinite looping across any screen up to 4K+
      const fragmentBefore = document.createDocumentFragment();
      for (let s = 0; s < 2; s++) {
        slides.forEach(slide => fragmentBefore.appendChild(slide.cloneNode(true)));
      }
      track.insertBefore(fragmentBefore, track.firstChild);

      const fragmentAfter = document.createDocumentFragment();
      for (let s = 0; s < 3; s++) {
        slides.forEach(slide => fragmentAfter.appendChild(slide.cloneNode(true)));
      }
      track.appendChild(fragmentAfter);

      const baseIndex = count * 2; // Start on original set (index 20)
      let currentIndex = baseIndex;
      let isTransitioning = false;
      let isDragging = false;
      let startX = 0;
      let currentX = 0;
      let prevTranslate = 0;
      let dragDelta = 0;
      let hasDragged = false;
      let autoplayTimer = null;

      const AUTOPLAY_INTERVAL = 2200; // Time between slides (ms)
      const TRANSITION_DURATION = 450; // Smooth slide animation duration (ms)

      function getStepSize() {
        const first = track.firstElementChild;
        if (!first) return 124;
        const gap = parseFloat(getComputedStyle(track).gap) || 24;
        return first.getBoundingClientRect().width + gap;
      }

      function updatePosition(index, animated) {
        const step = getStepSize();
        currentX = -index * step;
        prevTranslate = currentX;

        if (animated) {
          track.style.transition = `transform ${TRANSITION_DURATION}ms cubic-bezier(0.25, 1, 0.5, 1)`;
          isTransitioning = true;
        } else {
          track.style.transition = 'none';
        }

        track.style.transform = `translate3d(${currentX}px, 0, 0)`;

        if (!animated) {
          void track.offsetWidth; // Force layout flush so jump takes effect immediately
        }
      }

      function nextSlide() {
        if (isTransitioning) return;
        currentIndex++;
        updatePosition(currentIndex, true);
      }

      function prevSlide() {
        if (isTransitioning) return;
        currentIndex--;
        updatePosition(currentIndex, true);
      }

      // Seamless infinite looping on transition end
      track.addEventListener('transitionend', function (e) {
        if (e.target !== track) return;
        isTransitioning = false;

        // Wrap around boundaries invisibly
        while (currentIndex >= baseIndex + count) {
          currentIndex -= count;
        }
        while (currentIndex < baseIndex) {
          currentIndex += count;
        }
        updatePosition(currentIndex, false);
      });

      // Autoplay controls
      function startAutoplay() {
        stopAutoplay();
        autoplayTimer = setInterval(nextSlide, AUTOPLAY_INTERVAL);
      }

      function stopAutoplay() {
        if (autoplayTimer) {
          clearInterval(autoplayTimer);
          autoplayTimer = null;
        }
      }

      wrapper.addEventListener('mouseenter', stopAutoplay);
      wrapper.addEventListener('mouseleave', function () {
        if (!isDragging) startAutoplay();
      });

      // Pause when browser tab is inactive to eliminate CPU and battery usage
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          stopAutoplay();
        } else {
          startAutoplay();
        }
      });

      // Pointer / Touch / Mouse drag interaction
      function onPointerDown(e) {
        if (isTransitioning) return;
        isDragging = true;
        hasDragged = false;
        dragDelta = 0;
        startX = (e.touches ? e.touches[0].clientX : e.clientX) || 0;
        stopAutoplay();
        track.style.transition = 'none';
        track.classList.add('grabbing');
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = (e.touches ? e.touches[0].clientX : e.clientX) || 0;
        const diff = clientX - startX;
        dragDelta = diff;

        if (Math.abs(diff) > 5) {
          hasDragged = true;
        }

        track.style.transform = `translate3d(${prevTranslate + diff}px, 0, 0)`;
      }

      function onPointerUp() {
        if (!isDragging) return;
        isDragging = false;
        track.classList.remove('grabbing');

        const step = getStepSize();
        const threshold = 30; // Min px to trigger slide transition

        if (Math.abs(dragDelta) > threshold) {
          const shift = Math.round(dragDelta / step);
          currentIndex -= (shift !== 0 ? shift : (dragDelta < 0 ? 1 : -1));
        }

        updatePosition(currentIndex, true);
        startAutoplay();
      }

      // Mouse drag listeners
      track.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      // Touch swipe listeners
      track.addEventListener('touchstart', onPointerDown, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);
      window.addEventListener('touchcancel', onPointerUp);

      // Prevent native image dragging
      track.addEventListener('dragstart', function (e) {
        e.preventDefault();
      });

      // Prevent link activation when dragging
      track.addEventListener('click', function (e) {
        if (hasDragged) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      // Arrow buttons
      if (nextBtn) {
        nextBtn.addEventListener('click', function () {
          stopAutoplay();
          nextSlide();
          startAutoplay();
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', function () {
          stopAutoplay();
          prevSlide();
          startAutoplay();
        });
      }

      // Keyboard navigation
      wrapper.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') {
          stopAutoplay();
          nextSlide();
          startAutoplay();
        } else if (e.key === 'ArrowLeft') {
          stopAutoplay();
          prevSlide();
          startAutoplay();
        }
      });

      // Window resize handling with debounce
      let resizeTimeout = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function () {
          updatePosition(currentIndex, false);
        }, 100);
      });

      // Initial alignment & autoplay startup
      updatePosition(currentIndex, false);
      startAutoplay();
    })();
  </script>
</body>
</html>
